const shanghaiToday=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());let calendarMonth=shanghaiToday().slice(0,7);
const names={inbox:'待分类',do:'重要且紧急',plan:'重要不紧急',delegate:'紧急不重要',later:'不重要不紧急'},subs={do:'现在处理',plan:'安排时间',delegate:'尽快处理或委托',later:'暂放，留待决定'};let tasks=[],folders=[],showDone=false,busy=false,deleted=null;const $=s=>document.querySelector(s);function el(tag,text){const e=document.createElement(tag);if(text)e.textContent=text;return e}function options(selected){const s=el('select');s.setAttribute('aria-label','移动任务到象限');for(const [k,v] of Object.entries(names)){const o=el('option',v);o.value=k;s.append(o)}s.value=selected;return s}async function api(path,body){const r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('操作没有保存成功，请重试');return r.json()}function status(s){$('#status').textContent=s}async function save(next){if(busy)return false;busy=true;try{await api('tasks',next);tasks=next;render();status('已保存到本机');return true}catch(e){status(e.message);return false}finally{busy=false}}function taskRow(t){const row=el('div');row.className='task'+(t.done?' done':'');const b=el('button',t.done?'↶':'✓');b.setAttribute('aria-label',t.done?'恢复任务':'完成任务');b.onclick=()=>save(tasks.map(x=>x.id===t.id?{...x,done:!x.done}:x));const s=el('span',t.text),q=options(t.q);q.onchange=()=>save(tasks.map(x=>x.id===t.id?{...x,q:q.value}:x));const d=el('button','×');d.setAttribute('aria-label','删除任务');d.onclick=()=>{deleted=t;save(tasks.filter(x=>x.id!==t.id)).then(()=>{if(!tasks.some(x=>x.id===t.id)){status('已删除，可撤销');$('#undo').hidden=false}})};const info=el('details');info.className='task-deadline';const summary=el('summary',t.deadline?formatDeadline(t.deadline):'设置截止时间');info.append(summary);const edit=el('span');edit.setAttribute('aria-label',t.text+' 的截止时间');setupDeadline(edit);edit.value=t.deadline||'';const confirm=el('button','保存时间');confirm.type='button';const commit=()=>{const deadline=readDeadline(edit);if(deadline!==null)save(tasks.map(x=>x.id===t.id?{...x,deadline}:x));};confirm.onclick=commit;edit.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit()}};const clear=el('button','清除');clear.type='button';clear.onclick=()=>save(tasks.map(x=>x.id===t.id?{...x,deadline:''}:x));info.append(edit,confirm,clear);row.dataset.taskId=t.id;row.append(b,s,q,d,info);return row}function render(){const matrix=$('.matrix');matrix.replaceChildren();for(const q of ['do','plan','delegate','later']){const div=el('div');div.className='quad';div.dataset.q=q;div.append(el('h3',names[q]),el('small',subs[q]));const list=tasks.filter(t=>t.q===q&&(showDone||!t.done));if(!list.length)div.append(el('p','暂无事项'));list.forEach(t=>div.append(taskRow(t)));matrix.append(div)}$('#inbox').replaceChildren();tasks.filter(t=>t.q==='inbox'&&(showDone||!t.done)).forEach(t=>$('#inbox').append(taskRow(t)));renderOverview()}function formatDeadline(value){return value.replace('T',' ')}
function deadlineState(value,now=new Date()){
 const due=new Date(value);if(due<now)return {text:'已逾期',kind:'overdue'};
 if(due.toDateString()===now.toDateString())return {text:'今天',kind:'today'};
 const days=Math.ceil((due-now)/86400000);return {text:days+'天内',kind:'upcoming'};
}
function renderOverview(){
 const list=tasks.filter(t=>!t.done&&t.deadline&&!isNaN(new Date(t.deadline))).sort((a,b)=>a.deadline.localeCompare(b.deadline)||a.text.localeCompare(b.text));
 renderCalendar();const rows=$('#deadline-rows');rows.replaceChildren();$('#deadline-empty').hidden=!!list.length;
 let overdue=0,today=0;
 for(const t of list){const state=deadlineState(t.deadline);if(state.kind==='overdue')overdue++;if(state.kind==='today')today++;
 const row=el('tr');const name=el('td');name.dataset.q=t.q;name.append(el('span',t.text),el('small',names[t.q]));
 const due=el('td');const time=el('time');time.dateTime=t.deadline;time.append(el('span',t.deadline.slice(0,10)),el('small',t.deadline.slice(11,16)));due.append(time);
 const statusCell=el('td',state.text);statusCell.className=state.kind;row.append(name,due,statusCell);rows.append(row);}
 $('#deadline-summary').textContent=list.length?list.length+' 件待办'+(overdue?' · '+overdue+' 件逾期':'')+(today?' · '+today+' 件今天到期':''):'';
}
function renderCalendar(){
 const [year,month]=calendarMonth.split('-').map(Number);$('#month-title').textContent=year+'年 '+month+'月';
 const root=$('#month-calendar');root.replaceChildren();
 for(const text of ['周一','周二','周三','周四','周五','周六','周日']){const label=el('div',text);label.className='weekday';root.append(label)}
 const start=(new Date(year,month-1,1).getDay()+6)%7,count=new Date(year,month,0).getDate(),total=Math.ceil((start+count)/7)*7;
 const dated=tasks.filter(t=>t.deadline&&(showDone||!t.done)).sort((a,b)=>a.deadline.localeCompare(b.deadline));
 const today=shanghaiToday();
 for(let index=0;index<total;index++){
  const day=index-start+1,cell=el('div');cell.className='calendar-day';
  if(day<1||day>count){cell.classList.add('outside');cell.setAttribute('aria-hidden','true');root.append(cell);continue}
  const date=calendarMonth+'-'+String(day).padStart(2,'0');cell.setAttribute('aria-label',date);const heading=el('div');heading.className='day-heading';heading.append(el('span',String(day)));if(date===today){cell.classList.add('is-today');heading.append(el('small','今天'))}cell.append(heading);
  const agenda=el('div');agenda.className='day-agenda';
  for(const t of dated.filter(t=>t.deadline.slice(0,10)===date)){
   const entry=el('button');entry.type='button';entry.className='calendar-task'+(t.done?' completed':'');entry.dataset.q=t.q;entry.title=t.text+' · '+formatDeadline(t.deadline)+' · '+names[t.q];entry.setAttribute('aria-label',entry.title);
   const time=el('time',t.deadline.slice(11,16));time.dateTime=t.deadline;entry.append(time,el('span',t.text));
   entry.onclick=()=>{const row=Array.from(document.querySelectorAll('.task')).find(r=>r.dataset.taskId===t.id);if(row){row.scrollIntoView({block:'nearest'});const details=row.querySelector('details');details.open=true;details.querySelector('input').focus()}};
   agenda.append(entry);
  }
  cell.append(agenda);root.append(cell);
 }
}
function shiftMonth(amount){const [year,month]=calendarMonth.split('-').map(Number),date=new Date(year,month-1+amount,1);calendarMonth=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0');renderCalendar()}
$('#prev-month').onclick=()=>shiftMonth(-1);$('#next-month').onclick=()=>shiftMonth(1);$('#this-month').onclick=()=>{calendarMonth=shanghaiToday().slice(0,7);renderCalendar()};
async function load(){try{const d=await api('state');tasks=d.tasks;folders=d.folders;render();status('任务保存在本机')}catch(e){status('无法连接，请先运行「启动工作台.command」')}}$('#quadrant').replaceWith(Object.assign(options('inbox'),{id:'quadrant'}));$('form').onsubmit=async e=>{e.preventDefault();const text=$('#text').value.trim();if(!text||busy)return;const deadline=readDeadline($('#deadline'));if(deadline===null)return;await save([...tasks,{id:(Date.now().toString(36)+Math.random().toString(36).slice(2)),text,q:$('#quadrant').value,done:false,deadline}]);if(tasks.some(t=>t.text===text)){$('#text').value='';$('#deadline').value=''}};$('#toggle').onclick=()=>{showDone=!showDone;$('#toggle').textContent=showDone?'隐藏已完成':'显示已完成';render()};$('#undo').onclick=async()=>{if(deleted){await save([...tasks,deleted]);if(tasks.some(x=>x.id===deleted.id)){$('#undo').hidden=true;deleted=null}}};$('#export').onclick=()=>{const a=el('a');const url=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));a.href=url;a.download='任务备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};if(window.parent!==window){
const notify=type=>window.parent.postMessage({type},'http://127.0.0.1:41416');
let lastHover=0;
document.addEventListener('mousemove',()=>{if(Date.now()-lastHover>100){notify('workspace-hover');lastHover=Date.now()}});
document.addEventListener('pointerdown',event=>{if(event.target.matches('input,select'))notify('workspace-focus')});
}
function parseDeadline(value){
 const text=value.trim();if(!text)return '';
 const m=text.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})[ T]+(\d{1,2}):(\d{2})$/);
 if(!m)return null;
 const [,y,mo,d,h,mi]=m.map(Number);
 const leap=y%4===0&&(y%100!==0||y%400===0);
 const days=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
 if(y<1||mo<1||mo>12||d<1||d>days[mo-1]||h>23||mi>59)return null;
 return String(y).padStart(4,'0')+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')+'T'+String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
}
function readDeadline(input){
 const date=input.querySelector('.deadline-date'),hour=input.querySelector('.deadline-hour'),minute=input.querySelector('.deadline-minute');
 for(const field of [date,hour,minute])field.setCustomValidity('');
 if(!date.value&&!date.querySelector('.deadline-month').value&&!date.querySelector('.deadline-day').value&&!hour.value&&!minute.value)return '';
 if(!date.value){date.setCustomValidity('请选择截止日期');date.reportValidity();return null;}
 for(const [field,max,label] of [[hour,23,'小时（00–23）'],[minute,59,'分钟（00–59）']]){
  if(!/^\d{1,2}$/.test(field.value)||Number(field.value)>max){field.setCustomValidity('请输入'+label);field.reportValidity();return null;}
 }
 const result=parseDeadline(date.value+' '+hour.value.padStart(2,'0')+':'+minute.value.padStart(2,'0'));
 if(result===null){date.setCustomValidity('请输入有效日期');date.reportValidity();}
 return result;
}
function setupDeadline(input){
 input.classList.add('deadline-inputs');
 const date=el('span'),time=el('span'),hour=el('input'),minute=el('input');
 const label=input.getAttribute('aria-label')||'截止时间';
 date.className='deadline-date split-date';date.setAttribute('role','group');date.setAttribute('aria-label',label+' 日期');
 const year=el('span'),month=el('input'),day=el('input');let savedYear='';
 const refreshYear=()=>{year.textContent=savedYear||String(new Date().getFullYear())};refreshYear();
 year.className='deadline-year';year.title='年份跟随电脑；已有截止日期保留原年份';
 for(const [field,max,part,placeholder] of [[month,12,'月份','MM'],[day,31,'日期','DD']]){
  field.type='text';field.inputMode='numeric';field.maxLength=2;field.autocomplete='off';field.placeholder=placeholder;
  field.className=field===month?'deadline-month':'deadline-day';field.setAttribute('aria-label',label+' '+part);
  field.oninput=()=>{refreshYear();field.value=field.value.replace(/[^0-9]/g,'').slice(0,2);for(const f of [month,day,hour,minute])f.setCustomValidity('')};
  field.onblur=()=>{if(field.value&&Number(field.value)>=1&&Number(field.value)<=max)field.value=field.value.padStart(2,'0')};
  field.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();field.value=String(Math.max(1,Math.min(max,(Number(field.value)||1)+(e.key==='ArrowUp'?1:-1)))).padStart(2,'0');field.setCustomValidity('')}};
 }
 date.append(year,el('span','/'),month,el('span','/'),day);
 date.setCustomValidity=message=>{day.setCustomValidity(message)};date.reportValidity=()=>day.reportValidity();
 Object.defineProperty(date,'value',{get(){refreshYear();return month.value&&day.value?year.textContent+'-'+month.value.padStart(2,'0')+'-'+day.value.padStart(2,'0'):''},set(value){const parts=(value||'').split('-');savedYear=parts[0]||'';month.value=parts[1]||'';day.value=parts[2]||'';refreshYear()}});
 time.className='deadline-time split-time';time.setAttribute('role','group');time.setAttribute('aria-label',label+' 时间');
 for(const [field,max,part,placeholder] of [[hour,23,'小时','HH'],[minute,59,'分钟','MM']]){
  field.type='text';field.inputMode='numeric';field.maxLength=2;field.autocomplete='off';field.placeholder=placeholder;
  field.className=field===hour?'deadline-hour':'deadline-minute';field.setAttribute('aria-label',label+' '+part);field.title=part+'：00–'+max;
  field.oninput=()=>{field.value=field.value.replace(/[^0-9]/g,'').slice(0,2);for(const f of [date,hour,minute])f.setCustomValidity('')};
  field.onblur=()=>{if(field.value&&Number(field.value)<=max)field.value=field.value.padStart(2,'0')};
  field.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();const value=field.value?Number(field.value):0;field.value=String(Math.max(0,Math.min(max,value+(e.key==='ArrowUp'?1:-1)))).padStart(2,'0');field.setCustomValidity('')}};
 }
 const colon=el('span',':');colon.setAttribute('aria-hidden','true');time.append(hour,colon,minute);
 date.oninput=()=>{for(const f of [date,hour,minute])f.setCustomValidity('')};
 input.append(date,time);
 Object.defineProperty(input,'value',{get(){return date.value&&hour.value&&minute.value?date.value+'T'+hour.value.padStart(2,'0')+':'+minute.value.padStart(2,'0'):''},set(value){const parts=(value||'').replace(' ','T').split('T'),clock=(parts[1]||'').split(':');date.value=parts[0]||'';hour.value=clock[0]||'';minute.value=clock[1]||''}});
}

setupDeadline($('#deadline'));
load();
setInterval(renderOverview,60000);
</script></html>
